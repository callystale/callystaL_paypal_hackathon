services:
  budgetpal:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama-model:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ollama-model:
    image: ollama/ollama:latest
    entrypoint: ["ollama"]
    command: ["pull", "${OLLAMA_MODEL:-llama3.2:3b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ollama-data:
